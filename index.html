<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueLib Catalogue</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>BlueLib Catalogue</h1>
</header>

<nav>
    <a href="#books">Books</a>
    <a href="#add-book">Add Book</a>
</nav>

<main>

    <section id="books">
        <h2>Available Books</h2>

        <label for="search">Search by title:</label>
        <input type="text" id="search" placeholder="Search for a book...">

        <label for="category-filter">Filter by category:</label>
        <select id="category-filter">
            <option value="All">All Categories</option>
            <option value="IT">IT</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
        </select>

        <div id="book-list">

            <!-- Books will appear here -->
        </div>
    </section>

    <section id="add-book">
        <h2>Add Book</h2>

        <form id="book-form">

            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author:</label>
            <input type="text" id="author" name="author" required>

            <label for="category">Category:</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                <option value="IT">IT</option>
                <option value="Business">Business</option>
                <option value="Science">Science</option>
                <option value="Arts">Arts</option>
            </select>

            <label for="copies">Copies Available:</label>
            <input type="number" id="copies" name="copies" min="0" required>

            <button type="submit">Add Book</button>

        </form>
    </section>

</main>

<footer>
    <p> Eshun Charlotte Esi | Student ID: 400622039019</p>
</footer>

<script src="js/app.js"></script>
<script src="script.js"></script>

</body>
</html>
